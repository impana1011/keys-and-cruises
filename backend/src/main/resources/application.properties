spring.application.name=driveease-backend
spring.profiles.default=local
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/driveease}
spring.datasource.username=${DB_USERNAME:driveease_user}
spring.datasource.password=${DB_PASSWORD:driveease_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
